name = "fut27"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* * * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fut27"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
PAGES_PER_RUN = "4"
